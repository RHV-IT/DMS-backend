<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Scanner Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .setup-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.8em;
            margin-bottom: 10px;
            color: #667eea;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .status-message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        .info-text {
            font-size: 0.9em;
            color: #666;
            margin-top: 20px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="logo">📄</div>
        <h1 class="title">Document Scanner</h1>
        <p class="subtitle">Set up your document scanner to start digitizing your documents</p>

        <div id="status-message" class="status-message"></div>

        <button id="setup-btn" class="btn btn-primary">
            <span id="setup-text">Set Up Scanner</span>
        </button>

        <button id="retry-btn" class="btn btn-secondary hidden">
            Try Again
        </button>

        <p class="info-text">
            This will open your web browser to connect your scanner to the document management system.
        </p>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('setup-btn').addEventListener('click', startSetup);
            document.getElementById('retry-btn').addEventListener('click', startSetup);
        });

        async function startSetup() {
            const setupBtn = document.getElementById('setup-btn');
            const setupText = document.getElementById('setup-text');
            const retryBtn = document.getElementById('retry-btn');
            const statusMessage = document.getElementById('status-message');

            // Show loading state
            setupBtn.disabled = true;
            setupText.innerHTML = '<span class="loading"></span>Connecting...';
            statusMessage.className = 'status-message';
            statusMessage.style.display = 'none';
            retryBtn.classList.add('hidden');

            try {
                // Start local server if not already running
                const result = await ipcRenderer.invoke('start-setup-server');

                if (result.success) {
                    // Open browser to setup page
                    await ipcRenderer.invoke('open-setup-url', result.setupUrl);

                    // Poll for completion
                    pollSetupCompletion();
                } else {
                    showError('Failed to start setup server. Please try again.');
                }
            } catch (error) {
                console.error('Setup error:', error);
                showError('Setup failed. Please check your internet connection and try again.');
            }
        }

        function pollSetupCompletion() {
            const checkInterval = setInterval(async () => {
                try {
                    const result = await ipcRenderer.invoke('check-setup-complete');
                    if (result.complete) {
                        clearInterval(checkInterval);
                        showSuccess('Scanner setup complete! The scanner will start automatically.');
                        setTimeout(() => {
                            ipcRenderer.invoke('close-setup-window');
                        }, 2000);
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 2000);

            // Timeout after 5 minutes
            setTimeout(() => {
                clearInterval(checkInterval);
                showError('Setup timed out. Please try again.');
            }, 5 * 60 * 1000);
        }

        function showSuccess(message) {
            const statusMessage = document.getElementById('status-message');
            statusMessage.textContent = message;
            statusMessage.className = 'status-message status-success';
            statusMessage.style.display = 'block';

            document.getElementById('setup-btn').classList.add('hidden');
            document.getElementById('retry-btn').classList.add('hidden');
        }

        function showError(message) {
            const setupBtn = document.getElementById('setup-btn');
            const setupText = document.getElementById('setup-text');
            const statusMessage = document.getElementById('status-message');
            const retryBtn = document.getElementById('retry-btn');

            setupBtn.disabled = false;
            setupText.textContent = 'Set Up Scanner';
            statusMessage.textContent = message;
            statusMessage.className = 'status-message status-error';
            statusMessage.style.display = 'block';
            retryBtn.classList.remove('hidden');
        }
    </script>
</body>
</html>
