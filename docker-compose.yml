# ============================================================
# docker-compose.yml - DMS Backend Stack (Production - MongoDB Atlas)
# ============================================================
# Required environment variables (set in .env file):
#   MONGODB_URI    - Atlas connection string (REQUIRED)
#   JWT_SECRET     - JWT signing secret (REQUIRED)
#   JWT_REFRESH_SECRET - JWT refresh secret (REQUIRED)
#   SCANNER_TOKEN  - Scanner JWT token
#   ALLOWED_ORIGINS - Comma-separated CORS origins
#
# Copy .env.example to .env and fill in your values before running:
#   cp .env.example .env
#   docker compose up -d
# ============================================================

services:
  # ---- Main API Service ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dms-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      # Server
      - NODE_ENV=production
      - PORT=5000

      # MongoDB (Atlas) — set in .env file, never hardcode credentials
      - MONGODB_URI=${MONGODB_URI}

      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRE=15m
      - JWT_REFRESH_EXPIRE=7d

      # Password Policy
      - PASSWORD_EXPIRE_DAYS=90
      - PASSWORD_HISTORY_LIMIT=5
      - MIN_PASSWORD_LENGTH=8

      # File Upload
      - MAX_FILE_SIZE=52428800
      - UPLOAD_PATH=./uploads

      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,https://rhv-dms.vercel.app}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}

      # Swagger
      - ENABLE_SWAGGER=true

      # Vercel detection (set to "true" only if deploying to Vercel)
      # - VERCEL=true

    volumes:
      - uploads_data:/app/uploads
      - pending_data:/app/pending-uploads
    networks:
      - dms-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---- File Watcher Service ----
  watcher:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dms-watcher
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_BASE_URL=http://api:5000
      - SCAN_DIR=/app/uploads
      - SCANNER_TOKEN=${SCANNER_TOKEN}
      - UPLOAD_DELAY_MS=2000
    volumes:
      - uploads_data:/app/uploads
      - pending_data:/app/pending-uploads
    depends_on:
      api:
        condition: service_started
    networks:
      - dms-network
    command: ["node", "--no-deprecation", "watcher/scanner-watcher.js"]

  # ---- Scanner Agent Service ----
  scanner-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dms-scanner-agent
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - API_BASE_URL=http://api:5000
    volumes:
      - uploads_data:/app/uploads
      - pending_data:/app/pending-uploads
      - agent_config:/app/agent
    depends_on:
      api:
        condition: service_started
    networks:
      - dms-network
    command: ["node", "--no-deprecation", "agent/scanner-agent.js"]

# ============================================================
# Persistent Volumes
# ============================================================
volumes:
  uploads_data:
    driver: local
  pending_data:
    driver: local
  agent_config:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  dms-network:
    driver: bridge