# ============================================================
# docker-compose.yml - DMS Backend Stack (Production Ready)
# ============================================================
# This compose file provides a complete production deployment setup
# with proper environment management, secrets, and scalability.
#
# SETUP INSTRUCTIONS:
# 1. Copy .env.example to .env
# 2. Fill in your production values
# 3. Run: docker compose up -d
# 4. Check logs: docker compose logs -f
#
# ENVIRONMENT VARIABLES:
# - Set in .env file (see .env.example)
# - Never commit secrets to git
# - Use docker secrets for sensitive data in production
# ============================================================

version: '3.8'

services:
  # ---- Main API Service ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dms-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      # Override any defaults here if needed
      - NODE_ENV=production
      - SERVICE_NAME=api
    volumes:
      - uploads_data:/app/uploads
      - pending_data:/app/pending-uploads
      - ./logs:/app/logs
    networks:
      - dms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - redis
      - postgres  # Optional, for future use
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ---- Redis for Session Storage & Caching ----
  redis:
    image: redis:7-alpine
    container_name: dms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-defaultpassword}
    volumes:
      - redis_data:/data
    networks:
      - dms-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ---- PostgreSQL for Future Extensions ----
  postgres:
    image: postgres:15-alpine
    container_name: dms-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dms}
      - POSTGRES_USER=${POSTGRES_USER:-dms_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - dms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dms_user} -d ${POSTGRES_DB:-dms}"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ---- File Watcher Service ----
  watcher:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dms-watcher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=watcher
      - API_BASE_URL=http://api:5000
      - REDIS_URL=redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
      - pending_data:/app/pending-uploads
      - ./logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dms-network
    command: ["node", "--no-deprecation", "watcher/scanner-watcher.js"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M

  # ---- Scanner Agent Service ----
  scanner-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dms-scanner-agent
    restart: unless-stopped
    ports:
      - "${SCANNER_PORT:-4001}:4001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=scanner-agent
      - API_BASE_URL=http://api:5000
      - REDIS_URL=redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
      - pending_data:/app/pending-uploads
      - agent_config:/app/agent
      - ./logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dms-network
    command: ["node", "--no-deprecation", "agent/scanner-agent.js"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M

  # ---- Nginx Reverse Proxy (Optional) ----
  nginx:
    image: nginx:alpine
    container_name: dms-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

# ============================================================
# Persistent Volumes
# ============================================================
volumes:
  uploads_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/uploads
  pending_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/pending-uploads
  agent_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/agent-config
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres

# ============================================================
# Networks
# ============================================================
networks:
  dms-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16